name: Apibara.tech
description: >-
  Independent developer platform providing structured vehicle auction data (normalized JSON for Copart and IAA/IAAI
  current and historical auction records), including vehicle search, VIN/lot details, photos, prices, sale history,
  filter metadata, auction locations, shipping calculation, and an image proxy. Offers both a REST/JSON API and a hosted
  read-only MCP server. Not affiliated with the similarly named apibara.com blockchain indexer.
