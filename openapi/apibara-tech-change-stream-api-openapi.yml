openapi: 3.2.0
info:
  title: Apibara Copart & IAAI Vehicle Auction Change Stream API
  description: 'Structured JSON API for Copart and IAAI vehicle auction data. Search auction vehicles, retrieve VIN and lot details, photos, prices, auction status, sale history, related vehicles, filters, locations, usage information, image proxy responses, and auction-to-port shipping prices.


    Canonical public facts: 20M+ lifetime/cumulative indexed auction records; 3.9M+ supported vehicle records represented in the dataset; approximately 30K+ records added or refreshed daily; supported price/status refresh up to 15 minutes and often sooner; supported live-bid refresh about 10–15 seconds. Indexed records are not a unique-VIN count; source-dependent fields can be null.'
  version: 1.1.0
  termsOfService: https://apibara.tech/en/terms
  contact:
    name: Apibara
    url: https://apibara.tech/en/products/vehicle-auction-data-api
    email: admin@apibara.tech
  license:
    name: Proprietary
    url: https://apibara.tech/en/terms
  x-apibara-facts:
    lastVerified: '2026-10-04'
    lifetimeIndexedRecords: 20000000
    lifetimeIndexedRecordsLabel: 20M+
    lifetimeIndexedRecordsScope: lifetime_cumulative
    lifetimeIndexedRecordsMeaning: Lifetime/cumulative records indexed over time; not the current retained dataset and not a unique-VIN or unique-vehicle count.
    retainedDatasetSnapshot:
      measuredAt: '2026-10-19T19:30:03Z'
      currentSupportedVehicleRecords: 3931808
      retainedHistoricalAuctionRecords: 5696512
      currentPlusRetainedRecords: 9628320
    supportedVehicleRecords: 3931808
    supportedVehicleRecordsLabel: 3.9M+
    recordsAddedOrRefreshedDailyApprox: 30000
    recordsAddedOrRefreshedDailyLabel: 30K+
    generalRefreshMinutes: 15
    liveBidRefreshSeconds:
      min: 10
      max: 15
    freeRequestsMonthly: 100
    paymentCardRequiredForFreeTier: false
servers:
- url: https://apibara.tech/api/v1/vehicle-auction
  description: Production server
security:
- ApiKeyAuth: []
tags:
- name: Change Stream
  description: Durable, sequence-ordered material vehicle changes for reliable synchronization and replay.
paths:
  /changes:
    get:
      tags:
      - Change Stream
      summary: Read durable vehicle changes
      description: Read material Copart and IAAI changes in monotonically increasing sequence order. Persist meta.next_cursor only after your local transaction succeeds, then pass it back as after on the next request. Sequence gaps are valid. Non-material technical null/zero initialization noise is filtered. If a cursor falls outside the retained window, the API returns HTTP 410 cursor_expired instead of silently skipping events.
      operationId: listVehicleChanges
      parameters:
      - name: after
        in: query
        required: false
        description: Return events with sequence greater than this checkpoint. Start with 0 for the oldest retained event.
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: platform
        in: query
        required: false
        schema:
          type: string
          enum:
          - copart
          - iaai
      - name: event_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - lot.created
          - lot.updated
          - lot.sold
          - lot.not_sold
          - lot.removed
          - auction.rescheduled
          - auction.ended
          - bid.changed
          - buy_now.changed
      - name: terminal
        in: query
        required: false
        schema:
          type: boolean
      - name: lot_number
        in: query
        required: false
        schema:
          type: string
      - name: vin
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Sequence-ordered change events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleChangesResponse'
        '410':
          description: The requested checkpoint has expired from the retained replay window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeCursorExpiredResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-codeSamples:
      - lang: cURL
        source: 'curl -H "X-API-Key: YOUR_API_KEY" "https://apibara.tech/api/v1/vehicle-auction/changes?after=0&limit=100"'
      x-agentic-access:
        action-class: connected
        consequence: read
        subject: optional
        token:
          max-ttl: 3600
        audit: none
components:
  schemas:
    ApiError:
      type: object
      additionalProperties: true
      properties:
        ok:
          type:
          - boolean
          - 'null'
        message:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - object
          - array
          - 'null'
        errors:
          type:
          - object
          - array
          - 'null'
    VehicleChangeEvent:
      type: object
      required:
      - sequence
      - event_id
      - event
      - terminal
      - vehicle
      - changed_fields
      - before
      - after
      - recorded_at
      properties:
        sequence:
          type: integer
          format: int64
          example: 918273645
        event_id:
          type: string
          example: chg_918273645
        event:
          type: string
          enum:
          - lot.created
          - lot.updated
          - lot.sold
          - lot.not_sold
          - lot.removed
          - auction.rescheduled
          - auction.ended
          - bid.changed
          - buy_now.changed
        terminal:
          type: boolean
          description: True only for terminal outcomes such as sold, not sold or removed.
        reason:
          type:
          - string
          - 'null'
          examples:
          - source_outcome
          - source_removed
          - awaiting_approval
        vehicle:
          type: object
          required:
          - platform
          - lot_number
          properties:
            id:
              type:
              - integer
              - 'null'
              format: int64
            platform:
              type: string
              enum:
              - copart
              - iaai
            platform_id:
              type:
              - integer
              - 'null'
            lot_number:
              type: string
            vin:
              type:
              - string
              - 'null'
        changed_fields:
          type: array
          items:
            type: string
          description: Canonical field paths changed by this event.
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
        vehicle_updated_at:
          type:
          - string
          - 'null'
          format: date-time
        recorded_at:
          type: string
          format: date-time
    VehicleChangesResponse:
      type: object
      required:
      - ok
      - data
      - meta
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/VehicleChangeEvent'
        meta:
          type: object
          required:
          - schema_version
          - after
          - next_cursor
          - has_more
          - count
          - retention_days
          - ordering
          properties:
            schema_version:
              type: string
              example: 2026-10-04.beta1
            after:
              type: integer
              format: int64
            next_cursor:
              type: integer
              format: int64
            has_more:
              type: boolean
            count:
              type: integer
            oldest_available_sequence:
              type:
              - integer
              - 'null'
              format: int64
            latest_available_sequence:
              type:
              - integer
              - 'null'
              format: int64
            retention_days:
              type: integer
              example: 14
            ordering:
              type: string
              const: sequence_asc
    ChangeCursorExpiredResponse:
      type: object
      required:
      - ok
      - error
      - message
      - meta
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          const: cursor_expired
        message:
          type: string
        meta:
          type: object
          properties:
            schema_version:
              type: string
            requested_after:
              type: integer
              format: int64
            oldest_available_cursor:
              type: integer
              format: int64
            oldest_available_sequence:
              type: integer
              format: int64
            latest_available_sequence:
              type:
              - integer
              - 'null'
              format: int64
            retention_days:
              type: integer
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Apibara API key.
