openapi: 3.2.0
info:
  title: Apibara Copart & IAAI Vehicle Auction Vehicles API
  description: 'Structured JSON API for Copart and IAAI vehicle auction data. Search auction vehicles, retrieve VIN and lot details, photos, prices, auction status, sale history, related vehicles, filters, locations, usage information, image proxy responses, and auction-to-port shipping prices.


    Canonical public facts: 20M+ lifetime/cumulative indexed auction records; 3.9M+ supported vehicle records represented in the dataset; approximately 30K+ records added or refreshed daily; supported price/status refresh up to 15 minutes and often sooner; supported live-bid refresh about 10–15 seconds. Indexed records are not a unique-VIN count; source-dependent fields can be null.'
  version: 1.1.0
  termsOfService: https://apibara.tech/en/terms
  contact:
    name: Apibara
    url: https://apibara.tech/en/products/vehicle-auction-data-api
    email: admin@apibara.tech
  license:
    name: Proprietary
    url: https://apibara.tech/en/terms
  x-apibara-facts:
    lastVerified: '2026-10-04'
    lifetimeIndexedRecords: 20000000
    lifetimeIndexedRecordsLabel: 20M+
    lifetimeIndexedRecordsScope: lifetime_cumulative
    lifetimeIndexedRecordsMeaning: Lifetime/cumulative records indexed over time; not the current retained dataset and not a unique-VIN or unique-vehicle count.
    retainedDatasetSnapshot:
      measuredAt: '2026-10-19T19:30:03Z'
      currentSupportedVehicleRecords: 3931808
      retainedHistoricalAuctionRecords: 5696512
      currentPlusRetainedRecords: 9628320
    supportedVehicleRecords: 3931808
    supportedVehicleRecordsLabel: 3.9M+
    recordsAddedOrRefreshedDailyApprox: 30000
    recordsAddedOrRefreshedDailyLabel: 30K+
    generalRefreshMinutes: 15
    liveBidRefreshSeconds:
      min: 10
      max: 15
    freeRequestsMonthly: 100
    paymentCardRequiredForFreeTier: false
servers:
- url: https://apibara.tech/api/v1/vehicle-auction
  description: Production server
security:
- ApiKeyAuth: []
tags:
- name: Vehicles
  description: Search and retrieve vehicle auction records.
paths:
  /vehicles:
    get:
      tags:
      - Vehicles
      summary: List auction vehicles
      description: Search and incrementally synchronize normalized Copart and IAAI inventory. Filters are cumulative. Applied filters are echoed in meta.applied_filters; unrecognized query keys are reported in meta.unknown_filters. Use include_total=true only when an exact reconciliation count is required.
      operationId: listAuctionVehicles
      parameters:
      - name: s
        in: query
        required: false
        schema:
          type: string
        description: Search by lot number, VIN, or vehicle title.
        example: BMW X5 / 1HGCM82633A123456 / 12345678
      - name: lot_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - All
          - Timed
          - Buy Now
          default: All
        description: Lot status filter.
      - name: lot_sub_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Live
          - Open
          - Ended
          default: Open
        description: Normalized lot sub-status. Open = active/open and not sold; Live = currently live when supported; Ended = ended/closed state.
      - name: upcoming
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - only
          - without
          default: all
        description: Upcoming selector. all = no restriction; only = only upcoming eligible lots; without = exclude upcoming lots. This does not override Open/Sold state logic.
        example: only
      - name: updated_within_minutes
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 525600
        description: Return records whose updated_at changed within the requested number of minutes. Designed for incremental synchronization; combine with cursor pagination and auction filters.
        example: 15
      - name: price_min
        in: query
        required: false
        schema:
          type: number
        description: Minimum price.
        example: 1000
      - name: price_max
        in: query
        required: false
        schema:
          type: number
        description: Maximum price.
        example: 15000
      - name: year_from
        in: query
        required: false
        schema:
          type: integer
        description: Minimum vehicle year.
        example: 2018
      - name: year_to
        in: query
        required: false
        schema:
          type: integer
        description: Maximum vehicle year.
        example: 2024
      - name: auction_type
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 0
          - 1
          - 2
          default: 0
        description: 'Numeric auction platform filter: 0 = all supported platforms, 1 = Copart, 2 = IAAI. Use either auction_type or platform in the same request.'
        example: 1
      - name: platform
        in: query
        required: false
        schema:
          type: string
          enum:
          - copart
          - iaai
        description: Readable auction platform filter. Use copart or iaai. Use either platform or auction_type in the same request.
        example: copart
      - name: type
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Vehicle type. Multiple values are OR-ed; query-array syntax such as type[]=COUPE&type[]=AUTOMOBILE is supported.
        example: AUTOMOBILE
        style: form
        explode: true
      - name: body_style
        in: query
        required: false
        style: form
        explode: true
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Filter by vehicle_specs.body_style. Multiple values are OR-ed. Query-array syntax is supported, for example body_style[]=Coupe&body_style[]=Convertible. IAAI uses its VehicleClass value; Copart uses the source-backed Body Style field.
        example: Coupe
      - name: body_type
        in: query
        required: false
        deprecated: true
        style: form
        explode: true
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Compatibility alias for body_style. Multiple values are OR-ed. Prefer body_style for new integrations.
        example: Coupe
      - name: make
        in: query
        required: false
        schema:
          type: string
        description: Vehicle make.
        example: BMW
      - name: series
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        style: form
        explode: true
        description: 'Canonical vehicle series / model family. Examples: BMW Series 3, Mercedes-Benz C-Class, Toyota Camry, Audi A4, Ford F-150. Optional; can be combined with model and generation filters.'
        example: Series 3
      - name: model
        in: query
        required: false
        schema:
          type: string
        description: Vehicle model.
        example: X5
      - name: generation_id
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
            minimum: 1
          - type: array
            items:
              type: integer
              minimum: 1
        style: form
        explode: true
        description: Vehicle generation catalog ID. Use /vehicles/filters?make=BMW&model=X5 to discover valid IDs. Multiple IDs are supported.
        example: 379
      - name: generation
        in: query
        required: false
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        style: form
        explode: true
        description: Human-readable generation alias, for example F15, E70 or G05. generation_id is preferred for stable integrations.
        example: F15
      - name: color
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Vehicle color. Multiple values are supported.
        example:
        - Black
        - White
        style: form
        explode: true
      - name: vin_prefix
        in: query
        required: false
        style: form
        explode: true
        schema:
          oneOf:
          - type: string
            maxLength: 79
          - type: array
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 3
        description: Match VINs that start with any supplied prefix (OR). Supports comma-separated values vin_prefix=1,4,5 and array syntax vin_prefix[]=1&vin_prefix[]=4&vin_prefix[]=5. Prefixes consist of 1–3 VIN letters/numbers; at most 20 unique prefixes. Combines with other filters, cursor, and include_total. Prefix does not guarantee manufacturing country.
        example: 1,4,5
      - name: fuel_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Diesel
            - Hybrid
            - Electric
            - Flexible
            - Gasoline
            - All others
        description: Normalized fuel type; Hybrid includes source values Hybrid, Electric and Gas Hybrid, Hybrid Engine, and Electric and Diesel Hybrid. Multiple values are supported.
        style: form
        explode: true
        example:
        - Gasoline
        - Hybrid
      - name: odometer_from
        in: query
        required: false
        schema:
          type: number
        description: Minimum odometer value.
        example: 0
      - name: odometer_to
        in: query
        required: false
        schema:
          type: number
        description: Maximum odometer value.
        example: 120000
      - name: engine_size_from
        in: query
        required: false
        schema:
          type: number
        description: Minimum engine size.
        example: 2
      - name: engine_size_to
        in: query
        required: false
        schema:
          type: number
        description: Maximum engine size.
        example: 5
      - name: engine_type
        in: query
        required: false
        schema:
          oneOf:
          - type: string
            enum:
            - I
            - V
            - W
            - B
            - H
          - type: array
            items:
              type: string
              enum:
              - I
              - V
              - W
              - B
              - H
        style: form
        explode: true
        description: Engine layout. I=inline, V=V engine, W=W engine, B/H=boxer/horizontally opposed. Scalar and repeated-array forms are supported.
        example: I
      - name: transmission
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Manual
            - Unknown
            - Automatic
        description: Transmission type. Multiple values are supported.
        style: form
        explode: true
        example:
        - Automatic
      - name: cylinders
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
        description: Number of cylinders. Multiple values are supported.
        example:
        - 4
        - 6
        style: form
        explode: true
      - name: drive_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - AWD
            - FWD
            - RWD
        description: Drive type. Multiple values are supported.
        style: form
        explode: true
        example:
        - AWD
        - FWD
      - name: run_cond
        in: query
        required: false
        schema:
          type: string
          enum:
          - STATIONARY
          - NO INFORMATION
          - RUNS AND DRIVES
          - ENGINE START PROGRAM
        description: Run condition.
      - name: damage
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Fire
            - Hail
            - Theft
            - Water
            - Chemical
            - Rollover
            - Mechanical
            - Vandalized
            - Repossession
        description: Damage type. Multiple values are supported.
        style: form
        explode: true
        example:
        - Hail
        - Mechanical
      - name: has_key
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'No'
          - All
          - With
        description: Filter vehicles by key availability.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Cursor for pagination.
        example: next_cursor or prev_cursor
      - name: zip
        in: query
        required: false
        schema:
          type: string
        description: ZIP code for location-based search.
        example: '33166'
      - name: radius
        in: query
        required: false
        schema:
          type: number
        description: Search radius around ZIP.
        example: 50
      - name: units
        in: query
        required: false
        schema:
          type: string
          enum:
          - km
          - mi
          default: mi
        description: Distance units.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Records per vehicle-search page. Default 20. The effective maximum is plan-dependent; public plan entitlements can use maxima of 20, 30 or 40, while approved custom plans may differ. Use the active account entitlement as the runtime source of truth.
        example: 20
        x-apibara-plan-dependent: true
        x-apibara-known-direct-limits:
          default: 20
          pro_plus: 30
          pro_max: 30
          mega: 40
          mega_max: 40
          custom_possible:
          - 50
          - 100
        x-plan-dependent: true
        x-public-tier-maxima:
        - 20
        - 30
        - 40
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, meta.total contains an exact filtered count. Counts are cached briefly; omit this parameter for the lowest-latency cursor synchronization path.
        example: true
      - name: facility_id
        in: query
        required: false
        schema:
          type: string
        description: Auction facility ID.
        example: '136'
      - name: loc_state
        in: query
        required: false
        schema:
          oneOf:
          - type: string
            pattern: ^[A-Za-z]{2,3}$
          - type: array
            items:
              type: string
              pattern: ^[A-Za-z]{2,3}$
        description: Auction facility state/region code. Accepts a scalar or repeated/form-style array, e.g. loc_state=FL or loc_state[]=FL.
        example: FL
        style: form
        explode: true
      - name: office_name
        in: query
        required: false
        schema:
          type: string
        description: Auction office or branch name.
        example: Miami
      - name: auction_date_from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Auction date from.
        example: '2026-03-20'
      - name: auction_date_to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Auction date to.
        example: '2026-03-25'
      - name: today_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Return only vehicles with auctions today.
      - name: sale_document_pending
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Filter by pending sale document.
      - name: sale_document_type
        in: query
        required: false
        schema:
          type: string
        description: Sale document type.
        example: clean
      - name: seller_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - dealer
          - finance
          - insurance
          - non_insurance
        description: Seller type.
      - name: has_shipping_price
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Return only vehicles with shipping price data.
      responses:
        '200':
          description: Paginated list of vehicle auction records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListResponse'
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-Subscription-Limit:
              $ref: '#/components/headers/SubscriptionLimit'
            X-Subscription-Base-Limit:
              $ref: '#/components/headers/SubscriptionBaseLimit'
            X-Subscription-Extra-Limit:
              $ref: '#/components/headers/SubscriptionExtraLimit'
            X-Subscription-Used:
              $ref: '#/components/headers/SubscriptionUsed'
            X-Subscription-Remaining:
              $ref: '#/components/headers/SubscriptionRemaining'
            X-Subscription-Period-Start:
              $ref: '#/components/headers/SubscriptionPeriodStart'
            X-Subscription-Period-End:
              $ref: '#/components/headers/SubscriptionPeriodEnd'
            X-Per-Page-Limit:
              $ref: '#/components/headers/PerPageLimit'
        '400':
          description: Bad request. One or more parameters are invalid.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-Subscription-Limit:
              $ref: '#/components/headers/SubscriptionLimit'
            X-Subscription-Base-Limit:
              $ref: '#/components/headers/SubscriptionBaseLimit'
            X-Subscription-Extra-Limit:
              $ref: '#/components/headers/SubscriptionExtraLimit'
            X-Subscription-Used:
              $ref: '#/components/headers/SubscriptionUsed'
            X-Subscription-Remaining:
              $ref: '#/components/headers/SubscriptionRemaining'
            X-Subscription-Period-Start:
              $ref: '#/components/headers/SubscriptionPeriodStart'
            X-Subscription-Period-End:
              $ref: '#/components/headers/SubscriptionPeriodEnd'
            X-Per-Page-Limit:
              $ref: '#/components/headers/PerPageLimit'
        '401':
          description: Unauthorized. Missing or invalid X-API-Key.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
