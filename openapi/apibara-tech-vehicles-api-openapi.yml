        source: "const response = await fetch(\"https://apibara.tech/api/v1/vehicle-auction/vehicles/{slugVin}\", {\n  method: \"GET\",\n  headers: {\n    Accept: \"application/json\",\n    \"X-API-Key\": process.env.APIBARA_API_KEY,\n  },\n});\nif (!response.ok) throw new Error(`HTTP ${response.status}`);\nconsole.log(await response.json());"
components:
  headers:
    SubscriptionPeriodEnd:
      description: End of the active subscription quota period.
      schema:
        type: string
        format: date-time
    PerPageLimit:
      description: Effective maximum page size for the authenticated plan/workflow.
      schema:
        type: integer
    SubscriptionBaseLimit:
      description: Base subscription request allowance for the active period.
      schema:
        type: integer
    RateLimitLimit:
      description: Current short-window request limit when rate limiting applies.
      schema:
        type: integer
    SubscriptionUsed:
      description: Requests consumed in the active subscription period.
      schema:
        type: integer
    SubscriptionLimit:
      description: Total subscription request allowance for the active period.
      schema:
        type: integer
    SubscriptionPeriodStart:
      description: Start of the active subscription quota period.
      schema:
        type: string
        format: date-time
    SubscriptionRemaining:
      description: Requests remaining in the active subscription period.
      schema:
        type: integer
    RateLimitRemaining:
      description: Remaining requests in the current short-window rate-limit bucket.
      schema:
        type: integer
    SubscriptionExtraLimit:
      description: Additional request allowance applied to the active period.
      schema:
        type: integer
  schemas:
    VehicleLocation:
      type: object
      properties:
        display:
          type: string
          example: Englishtown (NJ)
        state:
          type: string
          example: NJ
        facility_id:
          type: string
          example: '136'
      additionalProperties: true
    MediaInfo:
      type: object
      properties:
        thumbs_count:
          type: integer
          example: 17
        has_360:
          type: boolean
          example: true
        photos:
          type: array
          items:
            type: string
            format: uri
      additionalProperties: true
    Vehicle:
      type: object
      description: Normalized Copart or IAAI auction vehicle record.
      properties:
        platform:
          type: string
          example: iaai
        lot_number:
          type: string
          example: '45416833'
        vin:
          type: string
          example: 2HKRM4H7XEH623608
        title:
          type: string
          example: 2014 HONDA CR-V EX-L
        year:
          type: integer
          example: 2014
        make:
          type: string
          example: HONDA
        model:
          type: string
          example: CR-V
        type:
          type: string
          example: AUTOMOBILE
        color:
          type: string
          example: Black
        fuel_type:
          type: string
          example: Gasoline
        transmission:
          type: string
          example: Automatic
        drive_type:
          type: string
          example: AWD
        odometer:
          type: number
          example: 120000
        damage:
          type: string
          example: Mechanical
        auction:
          $ref: '#/components/schemas/AuctionInfo'
        pricing:
          $ref: '#/components/schemas/PricingInfo'
        location:
          $ref: '#/components/schemas/VehicleLocation'
        media:
          $ref: '#/components/schemas/MediaInfo'
      additionalProperties: true
    PricingInfo:
      type: object
      properties:
        current_bid_usd:
          type: number
          example: 25
        buy_now_usd:
          type:
          - number
          - 'null'
        sale_price_usd:
          type:
          - number
          - 'null'
      additionalProperties: true
    VehicleDetailsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Vehicle'
    CursorMeta:
      type: object
      properties:
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        next_cursor:
          type:
          - string
          - 'null'
          example: eyJ2ZWhpY2xlcy5hZCI6IjIwMjYtMDctMTMgMTY6MzA6MDAiLCJ2ZWhpY2xlcy51cGRhdGVkX2F0IjoiMjAyNi0wNy0xMSAwODowOToyOSIsIl9wb2ludHNUb05leHRJdGVtcyI6dHJ1ZX0
        prev_cursor:
          type:
          - string
          - 'null'
          example: null
      additionalProperties: true
      description: Cursor pagination metadata.
      required:
      - per_page
      - next_cursor
      - prev_cursor
    AuctionInfo:
      type: object
      properties:
        state:
          type: string
          example: open
        auction_at:
          type: string
          format: date-time
          example: '2026-06-22T13:30:00+00:00'
        lot_status:
          type: string
          example: Timed
        lot_sub_status:
          type: string
          example: Open
      additionalProperties: true
    VehicleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        meta:
          $ref: '#/components/schemas/CursorMeta'
      required:
      - data
      - meta
    ApiError:
      type: object
      additionalProperties: true
      properties:
        ok:
          type:
          - boolean
          - 'null'
        message:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - object
          - array
          - 'null'
        errors:
          type:
          - object
          - array
          - 'null'
  responses:
    ValidationError:
      description: Request parameters failed validation.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-Subscription-Limit:
          $ref: '#/components/headers/SubscriptionLimit'
        X-Subscription-Base-Limit:
          $ref: '#/components/headers/SubscriptionBaseLimit'
        X-Subscription-Extra-Limit:
          $ref: '#/components/headers/SubscriptionExtraLimit'
        X-Subscription-Used:
          $ref: '#/components/headers/SubscriptionUsed'
        X-Subscription-Remaining:
          $ref: '#/components/headers/SubscriptionRemaining'
        X-Subscription-Period-Start:
          $ref: '#/components/headers/SubscriptionPeriodStart'
        X-Subscription-Period-End:
          $ref: '#/components/headers/SubscriptionPeriodEnd'
        X-Per-Page-Limit:
          $ref: '#/components/headers/PerPageLimit'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: The service or an upstream dependency is temporarily unavailable.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-Subscription-Limit:
          $ref: '#/components/headers/SubscriptionLimit'
        X-Subscription-Base-Limit:
          $ref: '#/components/headers/SubscriptionBaseLimit'
        X-Subscription-Extra-Limit:
          $ref: '#/components/headers/SubscriptionExtraLimit'
        X-Subscription-Used:
          $ref: '#/components/headers/SubscriptionUsed'
        X-Subscription-Remaining:
          $ref: '#/components/headers/SubscriptionRemaining'
        X-Subscription-Period-Start:
          $ref: '#/components/headers/SubscriptionPeriodStart'
        X-Subscription-Period-End:
          $ref: '#/components/headers/SubscriptionPeriodEnd'
        X-Per-Page-Limit:
          $ref: '#/components/headers/PerPageLimit'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: The authenticated key/plan is not allowed to perform this request.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-Subscription-Limit:
          $ref: '#/components/headers/SubscriptionLimit'
        X-Subscription-Base-Limit:
          $ref: '#/components/headers/SubscriptionBaseLimit'
        X-Subscription-Extra-Limit:
          $ref: '#/components/headers/SubscriptionExtraLimit'
        X-Subscription-Used:
          $ref: '#/components/headers/SubscriptionUsed'
        X-Subscription-Remaining:
          $ref: '#/components/headers/SubscriptionRemaining'
        X-Subscription-Period-Start:
          $ref: '#/components/headers/SubscriptionPeriodStart'
        X-Subscription-Period-End:
          $ref: '#/components/headers/SubscriptionPeriodEnd'
        X-Per-Page-Limit:
          $ref: '#/components/headers/PerPageLimit'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Apibara API key.
