name: Apibara Vehicle Auction MCP Server
description: Hosted, read-only remote MCP server exposing 8 tools mapped to the Apibara Vehicle Auction
  Data API. Anonymous initialize and tools/list succeed; tool CALLS require an X-API-Key. Protocol negotiated
  to 2025-11-25 on probe.
deployment:
  mode: remote
  endpoint: https://apibara.tech/mcp
  auth: api-key
  verified: probed
server:
  name: apibara-vehicle-auction-data
  version: 1.0.0
  protocol_version: '2025-11-25'
  registry_id: tech.apibara/vehicle-auction
  registry_url: https://registry.modelcontextprotocol.io/?q=tech.apibara%2Fvehicle-auction
  read_only: true
  transport_note: 'Streamable HTTP. The server requires an "Mcp-Method" request header whose value matches
    the JSON-RPC "method" (e.g. Mcp-Method: tools/list) or it returns error -32020 HeaderMismatch. tools/list
    is anonymous; tool calls require the X-API-Key header.'
  instructions: Read-only vehicle auction data tools. X-API-Key is required for tool calls.
tools:
- name: search_auction_vehicles
  description: Use for broad inventory discovery, filtering and incremental synchronization across supported
    Copart and IAA / IAAI records. For one known VIN or lot use get_vehicle; for retained auction appearances
    use get_vehicle_history.
  title: Search auction vehicles
  inputs:
  - s
  - platform
  - lot_status
  - lot_sub_status
  - upcoming
  - updated_within_minutes
  - make
  - model
  - year_from
  - year_to
  - price_min
  - price_max
  - facility_id
  - loc_state
  - today_only
  - has_shipping_price
  - per_page
  - cursor
- name: get_vehicle
  description: Use when the user already has a VIN, lot number or supported slug and needs the current
    normalized vehicle record. Request include history and/or vin_lots when the same tool call should
    also return retained sale history or other known auction lots for the same VIN.
  title: Get vehicle
  inputs:
  - identifier
- name: get_vehicle_history
  description: Use for retained Copart + IAAI auction appearances for one supported vehicle. This is auction-specific
    history, not complete ownership, registration or accident history.
  title: Get vehicle history
  inputs:
  - identifier
- name: get_related_vehicles
  description: Use after identifying a specific vehicle to retrieve related supported auction records
    for comparison or discovery. Do not use as a substitute for a broad filtered inventory search.
  title: Get related vehicles
  inputs:
  - identifier
  - per_page
- name: get_vehicle_filters
  description: Use before building a dynamic search UI or validating source-backed filter choices. Returns
    current filter metadata; it does not search inventory itself.
  title: Get vehicle filters
  inputs:
  - platform
- name: list_auction_locations
  description: Use to resolve supported auction yards, branches or facilities and their location metadata.
    Use calculate_shipping when the user needs auction-to-port pricing instead.
  title: List auction locations
  inputs:
  - platform
  - s
  - country
  - state
- name: calculate_shipping
  description: Use when the user asks for supported auction-to-port shipping pricing for a known vehicle.
    Supply either VIN or lot_number; optionally narrow the destination with port or port_id. Availability
    depends on auction location and route data.
  title: Calculate shipping
  inputs:
  - vin
  - lot_number
  - port
  - port_id
- name: get_api_usage
  description: Use to inspect request usage and current plan limits for the supplied X-API-Key. This is
    account/API-quota metadata, not vehicle data.
  title: Get API usage
  inputs: []
