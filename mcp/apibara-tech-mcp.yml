    title: Get vehicle
    description: Retrieve one supported vehicle record by VIN or slug_vin.
    inputs: [identifier]
  - name: get_vehicle_history
    title: Get vehicle history
    description: Retrieve retained Copart + IAAI auction history for one supported vehicle.
    inputs: [identifier]
  - name: get_related_vehicles
    title: Get related vehicles
    description: Retrieve related supported auction vehicles.
    inputs: [identifier, per_page]
  - name: get_vehicle_filters
    title: Get vehicle filters
    description: Retrieve current supported filter metadata for search UIs and integrations.
    inputs: [platform]
  - name: list_auction_locations
    title: List auction locations
    description: Retrieve supported auction facilities and locations.
    inputs: [platform, s, country, state]
  - name: calculate_shipping
    title: Calculate shipping
    description: Retrieve supported auction-to-port shipping information by VIN or lot number.
    inputs: [vin, lot_number, port, port_id]
  - name: get_api_usage
    title: Get API usage
