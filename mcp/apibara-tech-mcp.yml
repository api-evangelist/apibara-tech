deployment:
  mode: remote
  endpoint: https://apibara.tech/mcp
  auth: api-key
  verified: probed
server:
  name: apibara-vehicle-auction-data
  version: 1.0.0
  protocol_version: '2025-11-25'
  registry_id: tech.apibara/vehicle-auction
  registry_url: https://registry.modelcontextprotocol.io/?q=tech.apibara%2Fvehicle-auction
  read_only: true
  transport_note: >-
    Streamable HTTP. The server requires an "Mcp-Method" request header whose
    value matches the JSON-RPC "method" (e.g. Mcp-Method: tools/list) or it
    returns error -32020 HeaderMismatch. tools/list is anonymous; tool calls
    require the X-API-Key header.
  instructions: >-
    Read-only vehicle auction data tools. X-API-Key is required for tool calls.
tools:
  - name: search_auction_vehicles
    title: Search auction vehicles
    description: Search supported Copart and IAAI vehicle auction records.
    inputs: [s, platform, lot_status, lot_sub_status, upcoming, updated_within_minutes, make, model, year_from, year_to, price_min, price_max, facility_id, loc_state, today_only, has_shipping_price, per_page, cursor]
